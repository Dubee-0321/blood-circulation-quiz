<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood-Circulation-Quiz</title>
    <!-- CSS 강제 갱신용 버전 v=4 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <!-- 눈에 바로 보이는 SVG 방식의 선명한 세포들 -->
    <div class="cell-layer">
        <!-- 왼쪽 적혈구들 -->
        <div class="cell rbc cell-left-1" title="적혈구">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#ff4d6d"/>
                <circle cx="50" cy="50" r="22" fill="#c9184a"/>
            </svg>
        </div>
        <div class="cell rbc cell-left-2" title="적혈구">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#ff4d6d"/>
                <circle cx="50" cy="50" r="22" fill="#c9184a"/>
            </svg>
        </div>

        <!-- 오른쪽 백혈구들 -->
        <div class="cell wbc cell-right-1" title="백혈구">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="44" fill="#ffffff" stroke="#b8c0ff" stroke-width="4"/>
                <circle cx="38" cy="45" r="12" fill="#7209b7"/>
                <circle cx="58" cy="55" r="10" fill="#7209b7"/>
            </svg>
        </div>
        <div class="cell wbc cell-right-2" title="백혈구">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="44" fill="#ffffff" stroke="#b8c0ff" stroke-width="4"/>
                <circle cx="48" cy="48" r="14" fill="#7209b7"/>
            </svg>
        </div>
    </div>

    <!-- 메인 카드: 세 줄로 일정한 간격을 두고 배치된 3개의 요소 -->
    <div class="main-card">
        <h1 class="card-line">Blood-Circulation-Quiz</h1>
        <p class="card-line">Let's check what you studied</p>
        <button id="quiz-btn" class="card-line">START</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
